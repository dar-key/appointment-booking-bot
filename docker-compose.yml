services:
  redis:
    image: redis:7-alpine
    restart: always
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  bot:
    build: .
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DB_PATH=/app/data/bookings.db
    volumes:
      - sqlite_data:/app/data
      - ./credentials.json:/app/credentials.json:ro
    healthcheck:
      # Verifies the Python script is actively running in the process tree
      test: ["CMD-SHELL", "pgrep -f main.py || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s


volumes:
  redis_data:
  sqlite_data:
